<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<title>AI 品牌健檢｜LIFF</title>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- LIFF SDK -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<!-- Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#F7F3EE;
    --bg2:#F3EEE7;

    --card:#FFFDF9;

    --primary:#C58B5B;
    --primary-light:#E7C7A7;

    --text:#3A312B;
    --text-light:#7B6F66;

    --border:#EADFD3;

    --input:#FDF9F4;

    --success:#7BAE7F;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color: transparent;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;

    font-family:'Noto Sans TC',sans-serif;

    background:
    radial-gradient(circle at top,
    #FFF6EC 0%,
    #F7F3EE 45%,
    #F3EEE7 100%);

    color:var(--text);

    min-height:100vh;
}

/* Scrollbar */
::-webkit-scrollbar{
    width:5px;
}

::-webkit-scrollbar-thumb{
    background:rgba(197,139,91,.35);
    border-radius:20px;
}

/* Main Card */
.main-card{

    background:
    rgba(255,255,255,.72);

    backdrop-filter:blur(18px);

    border:1px solid rgba(197,139,91,.12);

    box-shadow:
    0 10px 40px rgba(176,138,102,.08);
}

/* Inputs */
.form-input{

    width:100%;

    background:var(--input);

    border:1px solid var(--border);

    border-radius:20px;

    padding:15px 16px;

    font-size:.96rem;

    transition:.25s ease;

    color:var(--text);
}

.form-input::placeholder{
    color:#B7AAA0;
}

.form-input:focus{

    outline:none;

    border-color:var(--primary);

    box-shadow:
    0 0 0 4px rgba(197,139,91,.12);
}

/* Goal Cards */
.goal-card{

    background:#FFFCF8;

    border:1px solid var(--border);

    border-radius:22px;

    padding:18px 14px;

    cursor:pointer;

    transition:.25s ease;
}

.goal-card:hover{

    transform:translateY(-2px);

    border-color:var(--primary);

    box-shadow:
    0 8px 20px rgba(197,139,91,.08);
}

.goal-card.active{

    background:rgba(229,198,164,.14);

    border-color:var(--primary);

    box-shadow:
    0 8px 20px rgba(197,139,91,.08);
}

.goal-card.active .goal-text{
    color:var(--primary);
}

/* Benefits */
.benefit-card{

    background:rgba(255,255,255,.7);

    border:1px solid rgba(197,139,91,.12);

    border-radius:22px;

    padding:16px;
}

/* Button */
.submit-btn{

    width:100%;

    background:
    linear-gradient(
    135deg,
    #D8A679 0%,
    #C58B5B 100%
    );

    border:none;

    color:white;

    font-weight:700;

    border-radius:24px;

    padding:18px;

    font-size:1rem;

    transition:.3s ease;

    box-shadow:
    0 12px 24px rgba(197,139,91,.18);
}

.submit-btn:hover{

    transform:translateY(-2px);

    box-shadow:
    0 18px 30px rgba(197,139,91,.24);
}

.submit-btn:disabled{
    opacity:.7;
}

/* Modal */
.modal-card{

    background:
    rgba(255,255,255,.92);

    backdrop-filter:blur(20px);

    border:1px solid rgba(197,139,91,.12);

    box-shadow:
    0 10px 40px rgba(176,138,102,.18);
}

/* Loading */
.loading-dot{
    animation:bounce 1s infinite;
}

.loading-dot:nth-child(2){
    animation-delay:.15s;
}

.loading-dot:nth-child(3){
    animation-delay:.3s;
}

@keyframes bounce{

    0%,80%,100%{
        transform:scale(0);
    }

    40%{
        transform:scale(1);
    }
}

</style>
</head>

<body>

<div class="max-w-3xl mx-auto px-4 py-6 sm:py-10">

    <!-- Card -->
    <div class="main-card rounded-[36px] p-6 sm:p-10">

        <!-- Header -->
        <div class="text-center">

            <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-[#FFF5EA] border border-[#F1D8BE] text-[#B97A49] text-xs font-semibold tracking-wide">
                優客多媒體工作坊
            </div>

            <h1 class="text-3xl sm:text-4xl font-extrabold mt-5 leading-tight tracking-[-0.03em]">
                打造你的高變現短影音定位
            </h1>

            <p class="mt-4 text-sm sm:text-base text-[#7B6F66] leading-8 max-w-2xl mx-auto">
                AI 將根據你的品牌、專業與客群，
                分析最適合你的流量切角、內容方向與短影音腳本策略。
            </p>

        </div>

        <!-- LINE Profile -->
        <div id="profileCard"
            class="hidden mt-8 bg-white/70 border border-[#EADFD3] rounded-[24px] p-4 flex items-center gap-4">

            <img id="profileImage"
                src=""
                class="w-14 h-14 rounded-full object-cover border border-[#EADFD3]">

            <div>

                <div class="text-xs text-[#B08A66] font-semibold mb-1">
                    LINE 使用者
                </div>

                <div id="profileName"
                    class="font-bold text-[17px] text-[#3A312B]">
                </div>

            </div>

        </div>

        <!-- Benefits -->
        <div class="grid sm:grid-cols-2 gap-4 mt-8 mb-10">

            <div class="benefit-card">
                <div class="font-semibold mb-1">
                    ✔ AI 流量定位分析
                </div>

                <div class="text-sm text-[#7B6F66] leading-7">
                    找出最適合你的市場切角與內容方向
                </div>
            </div>

            <div class="benefit-card">
                <div class="font-semibold mb-1">
                    ✔ 爆款主題規劃
                </div>

                <div class="text-sm text-[#7B6F66] leading-7">
                    提供高互動、高轉換的短影音主題
                </div>
            </div>

            <div class="benefit-card">
                <div class="font-semibold mb-1">
                    ✔ 開場 Hook 設計
                </div>

                <div class="text-sm text-[#7B6F66] leading-7">
                    幫你提升觀看停留與完播率
                </div>
            </div>

            <div class="benefit-card">
                <div class="font-semibold mb-1">
                    ✔ 個人 IP 建議
                </div>

                <div class="text-sm text-[#7B6F66] leading-7">
                    建立你的專業信任與品牌辨識度
                </div>
            </div>

        </div>

        <!-- FORM -->
        <form id="scriptForm" class="space-y-10">

            <!-- STEP 1 -->
            <section>

                <div class="border-b border-[#EADFD3] pb-3 mb-6">

                    <h2 class="text-[18px] font-bold text-[#C58B5B]">
                        Step 1. 品牌與專業定位
                    </h2>

                </div>

                <div class="space-y-5">

                    <div>

                        <label class="block text-sm font-semibold mb-2">
                            您的名字 / 品牌名稱
                        </label>

                        <input
                            type="text"
                            name="name"
                            required
                            placeholder="例如：Kevin / 優客顧問"
                            class="form-input"
                        />

                    </div>

                    <div>

                        <label class="block text-sm font-semibold mb-2">
                            目前職業 / 職稱角色
                        </label>

                        <input
                            type="text"
                            name="job"
                            required
                            placeholder="例如：品牌顧問 / 空調工程行老闆"
                            class="form-input"
                        />

                    </div>

                    <div>

                        <label class="block text-sm font-semibold mb-2">
                            您的核心技能 / 服務內容
                        </label>

                        <textarea
                            name="expertise"
                            rows="4"
                            required
                            placeholder="例如：全委任店家經營自媒體達到線上曝光。"
                            class="form-input resize-none"
                        ></textarea>

                    </div>

                </div>

            </section>

            <!-- STEP 2 -->
            <section>

                <div class="border-b border-[#EADFD3] pb-3 mb-6">

                    <h2 class="text-[18px] font-bold text-[#C58B5B]">
                        Step 2. 客群與內容目標
                    </h2>

                </div>

                <div class="space-y-6">

                    <div>

                        <label class="block text-sm font-semibold mb-2">
                            您的理想客戶是誰？
                        </label>

                        <input
                            type="text"
                            name="audience"
                            required
                            placeholder="例如：想經營個人品牌的創業者"
                            class="form-input"
                        />

                    </div>

                    <div>

                        <label class="block text-sm font-semibold mb-4">
                            這隻影片想達成的目標？
                        </label>

                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">

                            

                            <label class="goal-card">

                                <input type="radio"
                                    name="goal"
                                    value="快速增加粉絲"
                                    class="hidden">

                                <div class="text-center">

                                    <div class="text-2xl mb-2">
                                        📈
                                    </div>

                                    <div class="goal-text text-sm font-semibold text-[#7B6F66]">
                                        增加粉絲
                                    </div>

                                </div>

                            </label>

                            <label class="goal-card">

                                <input type="radio"
                                    name="goal"
                                    value="提高互動與留言"
                                    class="hidden">

                                <div class="text-center">

                                    <div class="text-2xl mb-2">
                                        💬
                                    </div>

                                    <div class="goal-text text-sm font-semibold text-[#7B6F66]">
                                        引導留言
                                    </div>

                                </div>

                            </label>

                            <label class="goal-card">

                                <input type="radio"
                                    name="goal"
                                    value="建立專業信任感"
                                    class="hidden">

                                <div class="text-center">

                                    <div class="text-2xl mb-2">
                                        💎
                                    </div>

                                    <div class="goal-text text-sm font-semibold text-[#7B6F66]">
                                        品牌專業
                                    </div>

                                </div>

                            </label>

                            <label class="goal-card">

                                <input type="radio"
                                    name="goal"
                                    value="提升話題與流量"
                                    class="hidden">

                                <div class="text-center">

                                    <div class="text-2xl mb-2">
                                        🔥
                                    </div>

                                    <div class="goal-text text-sm font-semibold text-[#7B6F66]">
                                        話題流量
                                    </div>

                                </div>

                            </label>

                            

                        </div>

                    </div>

                </div>

            </section>

            <!-- STEP 3 -->
            <section>

                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 border-b border-[#EADFD3] pb-3 mb-6">

                    <h2 class="text-[18px] font-bold text-[#C58B5B]">
                        Step 3. 客戶最常遇到的問題
                    </h2>

                    <div class="px-3 py-1 rounded-full bg-[#FFF5EA] border border-[#F1D8BE] text-[#B97A49] text-xs font-semibold">
                        AI 分析核心資料
                    </div>

                </div>

                <div class="space-y-4">

                    <input
                        type="text"
                        name="pain_point_1"
                        required
                        placeholder="01｜例如：為什麼短影音都沒流量？"
                        class="form-input"
                    />

                    <input
                        type="text"
                        name="pain_point_2"
                        required
                        placeholder="02｜例如：不知道該拍什麼內容"
                        class="form-input"
                    />

                    <input
                        type="text"
                        name="pain_point_3"
                        required
                        placeholder="03｜例如：有專業但不會包裝品牌"
                        class="form-input"
                    />

                </div>

            </section>

            <!-- SUBMIT -->
            <button
                type="submit"
                id="submitBtn"
                class="submit-btn flex items-center justify-center gap-3">

                <span id="btnText">
                    開始生成30秒口播檔案
                </span>

                <div id="loadingDots"
                    class="hidden items-center gap-1">

                    <div class="loading-dot w-2 h-2 rounded-full bg-white"></div>
                    <div class="loading-dot w-2 h-2 rounded-full bg-white"></div>
                    <div class="loading-dot w-2 h-2 rounded-full bg-white"></div>

                </div>

            </button>

        </form>

    </div>

</div>

<!-- SUCCESS MODAL -->
<div id="successModal"
    class="hidden fixed inset-0 bg-black/30 backdrop-blur-sm z-50 flex items-center justify-center p-4">

    <div class="modal-card max-w-md w-full rounded-[36px] p-8 text-center">

        <div class="w-20 h-20 rounded-full bg-[#F8EEE4] border border-[#EFD8BE] flex items-center justify-center mx-auto text-3xl mb-5">
            ✨
        </div>

        <h3 class="text-2xl font-bold text-[#3A312B] mb-3">
            AI 顧問已開始分析
        </h3>

        <p class="text-sm text-[#7B6F66] leading-8 mb-6">
            稍後將直接透過 LINE 傳送
            你的專屬品牌定位、
            流量切角與腳本策略。
        </p>

        <button
            onclick="closeLiffWindow()"
            class="w-full py-4 rounded-2xl text-white font-bold"
            style="
            background:
            linear-gradient(
            135deg,
            #D8A679 0%,
            #C58B5B 100%
            );
            ">

            完成

        </button>

    </div>

</div>

<script>

/* =========================================
   替換你的設定
========================================= */

const LIFF_ID = "2009393389-xo7I4wWZ";

const N8N_WEBHOOK_URL =
"https://YOUR_N8N_INSTANCE.com/webhook/your-endpoint-id";

/* =========================================
   LINE Profile
========================================= */

let lineProfile = null;

/* =========================================
   LIFF Init
========================================= */

async function initializeLiff(){

    try{

        await liff.init({
            liffId: LIFF_ID
        });

        if(!liff.isLoggedIn()){

            liff.login();
            return;
        }

        lineProfile = await liff.getProfile();

        console.log("LINE Profile:", lineProfile);

        // 顯示使用者資料
        document.getElementById("profileCard")
        .classList.remove("hidden");

        document.getElementById("profileImage")
        .src = lineProfile.pictureUrl;

        document.getElementById("profileName")
        .textContent = lineProfile.displayName;

    }catch(error){

        console.error("LIFF 初始化失敗:", error);

        alert("LIFF 初始化失敗");
    }
}

initializeLiff();

/* =========================================
   Goal Cards
========================================= */

const goalCards =
document.querySelectorAll(".goal-card");

goalCards.forEach(card => {

    const radio =
    card.querySelector('input[type="radio"]');

    card.addEventListener("click", () => {

        goalCards.forEach(c => {
            c.classList.remove("active");
        });

        card.classList.add("active");

        radio.checked = true;
    });

});

/* =========================================
   Submit
========================================= */

document.getElementById("scriptForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const submitBtn =
    document.getElementById("submitBtn");

    const btnText =
    document.getElementById("btnText");

    const loadingDots =
    document.getElementById("loadingDots");

    /* Loading */

    submitBtn.disabled = true;

    btnText.textContent =
    "AI 正在分析你的品牌定位";

    loadingDots.classList.remove("hidden");
    loadingDots.classList.add("flex");

    /* Form Data */

    const formData = new FormData(this);

    const payload = {

        // LINE 使用者資訊
        userId: lineProfile.userId,

        displayName: lineProfile.displayName,

        pictureUrl: lineProfile.pictureUrl,

        statusMessage:
        lineProfile.statusMessage || "",

        language:
        liff.getLanguage(),

        // 表單內容
        name:
        formData.get("name"),

        job:
        formData.get("job"),

        expertise:
        formData.get("expertise"),

        audience:
        formData.get("audience"),

        video_goal:
        formData.get("goal"),

        pain_points: [

            formData.get("pain_point_1"),

            formData.get("pain_point_2"),

            formData.get("pain_point_3")
        ],

        created_at:
        new Date().toISOString()
    };

    console.log(payload);

    try{

        const response = await fetch(
            N8N_WEBHOOK_URL,
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify(payload)
            }
        );

        if(response.ok){

            document.getElementById("successModal")
            .classList.remove("hidden");

        }else{

            alert("系統忙碌中，請稍後再試");
        }

    }catch(error){

        console.error(error);

        alert("系統連線失敗");
    }

    finally{

        submitBtn.disabled = false;

        btnText.textContent =
        "開始 AI 品牌健檢分析";

        loadingDots.classList.add("hidden");

        loadingDots.classList.remove("flex");
    }

});

/* =========================================
   Close LIFF
========================================= */

function closeLiffWindow(){

    if(liff.isInClient()){

        liff.closeWindow();

    }else{

        window.close();
    }
}

</script>

</body>
</html>
